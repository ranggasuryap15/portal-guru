# ==============================================================================
# Tujuan: Orchestrasi multi-container Docker untuk project Laravel portal-guru.
# Dipakai Oleh: docker compose CLI
# Dependensi: Docker daemon, Docker Compose v2+, image php:8.4-fpm-alpine, nginx:alpine, mysql:8.0, phpmyadmin
# Layanan: app (PHP-FPM dengan injection env DB), web (Nginx), db (MySQL 8.0), phpmyadmin (GUI DB)
# Side Effect: Menjalankan 4 container, alokasi port host (8002, 3307, 8082), persisten volume data MySQL
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portal-guru-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-portal_guru}
      DB_USERNAME: ${DB_USERNAME:-portal_guru}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - .:/var/www/html
    networks:
      - portal-guru-network
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: portal-guru-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8002}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - portal-guru-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: portal-guru-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-portal_guru}
      MYSQL_USER: ${DB_USERNAME:-portal_guru}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT_FORWARD:-3307}:3306"
    volumes:
      - portal_guru_db_data:/var/lib/mysql
    networks:
      - portal-guru-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: portal-guru-phpmyadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-portal_guru}
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${PMA_PORT:-8082}:80"
    networks:
      - portal-guru-network
    depends_on:
      - db

networks:
  portal-guru-network:
    driver: bridge

volumes:
  portal_guru_db_data:
    driver: local
