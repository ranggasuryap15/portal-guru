# ==============================================================================
# Tujuan: Konfigurasi virtual host Nginx untuk reverse proxy ke PHP-FPM Laravel.
# Dipakai Oleh: docker-compose.yml (service: web)
# Dependensi: Service portal-guru-app pada port 9000, direktori /var/www/html/public
# Fungsi Utama: Menyajikan static files, rewrite URL ke index.php, meneruskan FastCGI
# Side Effect: HTTP Request routing, proxy pass ke socket PHP-FPM
# ==============================================================================

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    index index.php index.html;
    charset utf-8;

    client_max_body_size 64M;

    # Log format standard
    access_log off;
    error_log /var/log/nginx/error.log error;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
