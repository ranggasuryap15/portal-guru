; ==============================================================================
; Tujuan: Konfigurasi runtime PHP (php.ini overrides) untuk portal-guru.
; Dipakai Oleh: docker/php/Dockerfile (service: app)
; Dependensi: PHP-FPM 8.3 runtime
; Fungsi Utama: Mengatur memory limit, upload size, execution time, dan Opcache
; Side Effect: Pengaruh alokasi memori proses PHP dan caching bytecode
; ==============================================================================

upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 120
date.timezone = Asia/Jakarta

opcache.enable = 1
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
opcache.max_accelerated_files = 10000
opcache.memory_consumption = 128
